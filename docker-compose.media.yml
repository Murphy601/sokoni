# Sokoni media studio sidecar (Phase 1+).
# Does not start WAHA or the Node bot — run alongside them on the VM:
#
#   docker compose -f docker-compose.media.yml up -d --build
#
# Then in whatsapp-bot/.env:
#   REMBG_URL=http://127.0.0.1:7000
#   STUDIO_PROVIDER=auto   # or rembg | photoroom | off
#   STUDIO_CLIP_ENABLED=true

services:
  rembg:
    build: ./media-worker
    image: sokoni-rembg:local
    container_name: sokoni-rembg
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:7000"
    environment:
      REMBG_MODEL: ${REMBG_MODEL:-u2net}
      REMBG_MAX_BYTES: ${REMBG_MAX_BYTES:-12582912}
      REMBG_MAX_SIDE: ${REMBG_MAX_SIDE:-1600}
    # Cap so a bad spike cannot OOM the bot host
    mem_limit: 1536m
    cpus: "1.5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
