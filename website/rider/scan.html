<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scan parcel QR — Sokoni Rider</title>
<meta name="description" content="Verify a Sokoni parcel QR / order id at seller pickup." />
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { green: '#25D366', purple: '#1B1035', cream: '#FFF8F0' } }, fontFamily: { sans: ['"DM Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'], display: ['Fraunces', 'Georgia', 'serif'] } } } };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,600;0,9..40,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/design-tokens.css" />
<link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="font-sans antialiased min-h-screen bg-[var(--sokoni-cream,#FFF8F0)] text-[var(--sokoni-ink,#1B1035)]">
  <main class="max-w-lg mx-auto px-5 py-10">
    <p class="text-xs font-semibold tracking-wide uppercase text-[#1B1035]/70 mb-2">Rider tools</p>
    <h1 class="font-display text-3xl font-bold mb-2">Scan parcel QR</h1>
    <p class="text-sm text-[#1B1035]/70 mb-6">
      Open the printable waybill for this order, or enter the pickup code from the seller on WhatsApp.
    </p>

    <div id="scan-panel" class="rounded-2xl border border-[#1B1035]/10 bg-white p-5 shadow-sm">
      <p class="text-xs font-semibold uppercase tracking-wide text-[#1B1035]/50 mb-1">Order</p>
      <p id="scan-order" class="text-2xl font-bold tracking-tight mb-4">—</p>
      <a id="scan-label-link" href="../label.html" class="inline-flex min-h-12 items-center justify-center rounded-full bg-[#25D366] px-6 font-semibold text-[#1B1035]">
        Open printable QR waybill
      </a>
      <p class="mt-4 text-sm text-[#1B1035]/70">
        At the shop: ask the seller for the 4-digit pickup code, then reply on WhatsApp:<br />
        <code id="scan-cmd" class="mt-2 block rounded-lg bg-[#1B1035]/5 px-3 py-2 text-sm">PICKUP SKN-XXXX ####</code>
      </p>
    </div>

    <p class="mt-8 text-center text-sm">
      <a href="dashboard.html" class="underline underline-offset-2">← Rider dashboard</a>
    </p>
  </main>
  <script src="../assets/js/order-id.js?v=skn-1"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get("order") || "";
      const id = (globalThis.SokoniOrderId?.normalizeOrderId(raw) || String(raw).trim().toUpperCase());
      const orderEl = document.getElementById("scan-order");
      const link = document.getElementById("scan-label-link");
      const cmd = document.getElementById("scan-cmd");
      if (id) {
        orderEl.textContent = id;
        link.href = `../label.html?order=${encodeURIComponent(id)}`;
        cmd.textContent = `PICKUP ${id} ####`;
      }
    })();
  </script>
</body>
</html>
