<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Track Order — Sokoni Mall</title>
<meta name="description" content="Track your Sokoni Mall order with SK-#### — live shipment status across Kenya." />
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { green: '#25D366', purple: '#1B1035', purpleLight: '#2E1B57', cream: '#FFF8F0' } }, fontFamily: { sans: ['"DM Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'], display: ['Fraunces', 'Georgia', 'serif'] } } } };
</script>
<script>
  (function () { document.documentElement.classList.add('dark'); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/design-tokens.css" />
<link rel="stylesheet" href="assets/css/styles.css" />
<link rel="stylesheet" href="assets/css/depop-shell.css" />
<link rel="stylesheet" href="assets/css/track.css" />
<link rel="stylesheet" href="assets/css/depop-surfaces.css" />
</head>
<body class="font-sans antialiased has-depop-shell min-h-screen flex flex-col depop-surface-page text-white" data-shell-page="track">
  <div id="sokoni-shell-header"></div>

  <main class="depop-main-content max-w-2xl mx-auto w-full px-5 py-10 flex-1">
    <p class="depop-label mb-2">Tracking</p>
    <h1 class="text-3xl font-black tracking-tight text-white mb-2">Track your order</h1>
    <p class="text-zinc-400 mb-8">Enter your <strong class="text-zinc-200">SK-####</strong> order number for live shipment status.</p>

    <form id="track-form" class="flex flex-col sm:flex-row gap-3 mb-10">
      <label for="order-id" class="sr-only">Order number</label>
      <input
        id="order-id"
        name="order"
        type="text"
        inputmode="text"
        autocomplete="off"
        placeholder="SK-1042"
        class="flex-1 min-h-[48px] rounded-2xl border border-zinc-800 bg-black px-4 text-base text-white placeholder:text-zinc-600 focus:outline-none focus:ring-2 focus:ring-[#FF2300]"
        required
      />
      <button type="submit" class="depop-btn-accent min-h-[48px] px-6">
        Track
      </button>
    </form>

    <div id="track-status" class="hidden depop-card p-6" aria-live="polite"></div>
    <div id="track-dispute" class="hidden mt-6 depop-card p-6 space-y-4"></div>
    <div id="track-error" class="hidden rounded-2xl border border-red-500/30 bg-red-500/10 text-red-300 px-5 py-4 text-sm" role="alert"></div>
    <div id="track-loading" class="hidden text-sm text-zinc-500">Loading tracking…</div>

    <div class="mt-12 depop-card p-5">
      <p class="text-sm font-semibold mb-3 text-white">Prefer WhatsApp?</p>
      <p class="text-sm text-zinc-400 mb-4">Type your order number or <em>track</em> in chat for the same live timeline.</p>
      <a href="https://wa.me/254117422428?text=track" target="_blank" rel="noopener"
         class="depop-btn-accent inline-flex">
        Open WhatsApp
      </a>
    </div>
  </main>

  <footer class="border-t border-zinc-900 py-8 text-center text-sm text-zinc-500">
    <p><a href="index.html" class="hover:text-white">Home</a> · <a href="terms.html" class="hover:text-white">Terms</a></p>
    <p class="mt-2">&copy; <span id="year"></span> Sokoni Mall Enterprise</p>
  </footer>

  <div id="sokoni-shell-nav"></div>

  <script src="assets/js/shell-chrome.js"></script>
  <script src="assets/js/depop-nav.js"></script>
  <script src="assets/js/buyer-auth.js"></script>
  <script src="assets/js/track.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>

  <!-- Path B: React + Framer Motion progressive enhancement (fail-soft) -->
  <script src="assets/js/sokoni-motion/sokoni-motion.js?v=20260806b" defer></script>
</body>
</html>
