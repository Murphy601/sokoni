<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ask Sokoni AI — Sokoni Mall</title>
<meta name="description" content="Ask Sokoni AI to find fashion and lifestyle deals across Kenya — 100% prepaid, order on WhatsApp." />
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { green: '#25D366', purple: '#1B1035', purpleLight: '#2E1B57', cream: '#FFF8F0' } }, fontFamily: { sans: ['"DM Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'], display: ['Fraunces', 'Georgia', 'serif'] } } } };
</script>
<script>
  (function () { try { var t = localStorage.getItem('sokoni-theme'); if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch (e) {} })();
</script>
<link rel="stylesheet" href="assets/css/design-tokens.css" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-brand-cream text-brand-purple font-sans antialiased min-h-screen flex flex-col">
  <header class="border-b border-black/5 dark:border-white/10 bg-brand-cream/90 dark:bg-brand-purple backdrop-blur sticky top-0 z-20">
    <div class="max-w-2xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
      <a href="index.html" class="text-sm font-medium hover:text-brand-green transition">← Shop</a>
      <span class="text-xs font-semibold uppercase tracking-wide text-brand-purple/50">Sokoni Plug</span>
    </div>
  </header>

  <main class="flex-1 max-w-2xl mx-auto w-full px-5 py-8 flex flex-col">
    <h1 class="font-display text-3xl font-bold mb-2">Ask Sokoni</h1>
    <p class="text-brand-purple/60 dark:text-white/60 text-sm mb-6">
      Discover items, check prepaid/escrow info, or track <strong>SK-####</strong> orders. Checkout stays on WhatsApp.
    </p>

    <div id="chat-log" class="flex-1 space-y-4 mb-6 min-h-[240px] overflow-y-auto rounded-2xl border border-black/5 dark:border-white/10 bg-white/70 dark:bg-brand-purpleLight/40 p-4"></div>

    <form id="ask-form" class="flex gap-2 sticky bottom-0 pb-4 bg-brand-cream dark:bg-brand-purple pt-2">
      <label for="ask-input" class="sr-only">Ask Sokoni</label>
      <input
        id="ask-input"
        type="text"
        autocomplete="off"
        placeholder="Party outfit under KES 3,000… or SK-1042"
        class="flex-1 min-h-[48px] rounded-2xl border border-black/10 dark:border-white/15 bg-white dark:bg-brand-purpleLight px-4 text-base focus:outline-none focus:ring-2 focus:ring-brand-green"
      />
      <button type="submit" class="min-h-[48px] px-5 rounded-full bg-brand-green text-brand-purple font-bold shrink-0">Ask</button>
    </form>
  </main>

  <footer class="border-t border-black/5 dark:border-white/10 py-6 text-center text-xs text-brand-purple/50">
    <a href="https://wa.me/254117422428" class="text-brand-green font-semibold">Order on WhatsApp</a>
    · <a href="track.html" class="hover:text-brand-green">Track order</a>
  </footer>

  <script src="assets/js/shop-ai.js"></script>
</body>
</html>
