<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ask Sokoni AI — Sokoni Mall</title>
<meta name="description" content="Ask Sokoni Plug to find fashion and lifestyle deals across Kenya — 100% prepaid, order on WhatsApp." />
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { green: '#25D366', purple: '#1B1035', purpleLight: '#2E1B57', cream: '#FFF8F0' } }, fontFamily: { sans: ['"DM Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'], display: ['Fraunces', 'Georgia', 'serif'] } } } };
</script>
<script>
  (function () { document.documentElement.classList.add('dark'); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/design-tokens.css" />
<link rel="stylesheet" href="assets/css/styles.css" />
<link rel="stylesheet" href="assets/css/depop-shell.css" />
<link rel="stylesheet" href="assets/css/depop-surfaces.css" />
</head>
<body class="font-sans antialiased has-depop-shell min-h-screen flex flex-col depop-surface-page text-white pb-24 md:pb-8" data-shell-page="ask">
  <div id="sokoni-shell-header"></div>

  <main class="depop-main-content flex-1 max-w-2xl mx-auto w-full px-5 py-8 flex flex-col">
    <p class="depop-label mb-2">Sokoni Plug</p>
    <h1 class="text-3xl font-black tracking-tight text-white mb-2">Ask Sokoni</h1>
    <p class="text-zinc-400 text-sm mb-4">
      Ask about categories, find live catalog deals, check prepaid/escrow &amp; delivery, or track <strong class="text-zinc-200">SK-####</strong> orders. Checkout stays on WhatsApp.
    </p>

    <div id="ask-suggestions" class="flex flex-wrap gap-2 mb-6" aria-label="Suggested questions">
      <button type="button" class="ask-suggest" data-ask="What categories do you have?">Categories</button>
      <button type="button" class="ask-suggest" data-ask="Show me women dresses">Women dresses</button>
      <button type="button" class="ask-suggest" data-ask="Kenya food — nyama choma or ugali plates">Kenya meals</button>
      <button type="button" class="ask-suggest" data-ask="Wines & spirits — Tusker, Kenya Cane, red wine">Wines & spirits</button>
      <button type="button" class="ask-suggest" data-ask="Electronics under 10000">Electronics under 10k</button>
      <button type="button" class="ask-suggest" data-ask="How does Sokoni prepaid escrow work?">Prepaid &amp; escrow</button>
      <button type="button" class="ask-suggest" data-ask="How does delivery work?">Delivery</button>
    </div>

    <div id="chat-log" class="ask-chat-log flex-1 space-y-4 mb-6 min-h-[240px] overflow-y-auto p-4"></div>

    <form id="ask-form" class="ask-chat-form flex gap-2 sticky bottom-20 md:bottom-0 pb-4 pt-2">
      <label for="ask-input" class="sr-only">Ask Sokoni</label>
      <input
        id="ask-input"
        type="text"
        autocomplete="off"
        placeholder="Party outfit under KES 3,000… or SK-1042"
        class="flex-1 min-h-[48px] rounded-2xl border border-zinc-800 bg-black px-4 text-base text-white placeholder:text-zinc-600 focus:outline-none focus:ring-2 focus:ring-[#FF2300]"
      />
      <button type="submit" class="depop-btn-accent shrink-0 min-h-[48px] px-5">Ask</button>
    </form>
  </main>

  <footer class="border-t border-zinc-900 py-6 text-center text-xs text-zinc-500">
    <a href="https://wa.me/254117422428" class="text-[#FF2300] font-semibold">Order on WhatsApp</a>
    · <a href="track.html" class="hover:text-white">Track order</a>
    · <a href="profile.html" class="hover:text-white">Profile</a>
  </footer>

  <div id="sokoni-shell-nav"></div>

  <script src="assets/js/shell-chrome.js"></script>
  <script src="assets/js/depop-nav.js"></script>
  <script src="assets/js/shop-ai.js"></script>
</body>
</html>
