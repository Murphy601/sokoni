<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flagged seller listings — Sokoni Admin</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          brand: { green: "#25D366", purple: "#1B1035", purpleLight: "#2E1B57", cream: "#FFF8F0" },
        },
        fontFamily: {
          sans: ['"DM Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
          display: ["Fraunces", "Georgia", "serif"],
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/design-tokens.css" />
</head>
<body class="bg-brand-cream text-brand-purple font-sans antialiased min-h-screen">
  <header class="border-b border-black/5 bg-white/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-5 py-4 flex items-center justify-between gap-3">
      <a href="index.html" class="font-display font-bold text-lg">Sokoni · Admin</a>
      <nav class="flex flex-wrap gap-2 text-xs font-semibold">
        <a href="admin-command.html" class="min-h-[36px] inline-flex items-center px-3 rounded-full border border-brand-purple/15">Command</a>
        <a href="admin-disputes.html" class="min-h-[36px] inline-flex items-center px-3 rounded-full border border-brand-purple/15">Disputes</a>
        <span class="min-h-[36px] inline-flex items-center px-3 rounded-full bg-brand-green text-brand-purple">Listings &amp; KYC</span>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-5 py-8 space-y-5">
    <section class="rounded-3xl border border-black/5 bg-white p-5 space-y-3">
      <h1 class="font-display text-2xl font-bold">Seller listing review</h1>
      <p class="text-sm text-brand-purple/65">
        Token-gated queue for hidden / flagged listings. Restore after review or keep removed.
      </p>
      <label class="block text-sm font-medium">
        Admin token
        <input
          id="admin-token"
          type="password"
          autocomplete="off"
          class="mt-1 w-full min-h-[44px] rounded-2xl border border-black/10 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-green"
          placeholder="ADMIN_SETUP_TOKEN"
        />
      </label>
      <div class="flex flex-wrap gap-2">
        <button id="admin-load-btn" type="button" class="min-h-[44px] px-4 rounded-full bg-brand-green text-brand-purple text-sm font-bold">
          Load flagged
        </button>
        <button id="admin-kyc-btn" type="button" class="min-h-[44px] px-4 rounded-full border border-brand-purple/20 text-sm font-semibold">
          Load KYC queue
        </button>
        <button id="admin-refresh-btn" type="button" class="min-h-[44px] px-4 rounded-full border border-brand-purple/20 text-sm font-semibold">
          Refresh
        </button>
      </div>
      <p id="admin-status" class="text-sm text-brand-purple/60" role="status" aria-live="polite"></p>
    </section>

    <section id="admin-kyc-list" class="space-y-3" aria-label="Seller KYC queue"></section>

    <section id="admin-list" class="space-y-3"></section>
  </main>

  <script src="assets/js/admin-seller-listings.js"></script>

  <!-- Path B: React + Framer Motion progressive enhancement (fail-soft) -->
  <script src="assets/js/sokoni-motion/sokoni-motion.js?v=20260806b" defer></script>
</body>
</html>
