<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Set new password — Sokoni Mall</title>
<meta name="description" content="Choose a new Sokoni Mall password from your reset link." />
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: { brand: { green: "#25D366", purple: "#1B1035" } },
        fontFamily: {
          sans: ['"DM Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
          display: ["Fraunces", "Georgia", "serif"],
        },
      },
    },
  };
</script>
<script>(function(){document.documentElement.classList.add("dark");})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/design-tokens.css" />
<link rel="stylesheet" href="assets/css/styles.css" />
<link rel="stylesheet" href="assets/css/depop-shell.css" />
<link rel="stylesheet" href="assets/css/depop-surfaces.css" />
</head>
<body class="font-sans antialiased has-depop-shell min-h-screen flex flex-col depop-surface-page text-white" data-shell-page="profile">
  <div id="sokoni-shell-header"></div>
  <main class="depop-main-content max-w-md mx-auto w-full px-5 py-8 flex-1">
    <section class="depop-card p-6 space-y-4">
      <p class="depop-label">Password</p>
      <h1 class="font-display text-3xl font-bold text-white">Set a new password</h1>
      <p class="text-sm text-zinc-400">Use at least 8 characters. You’ll be signed in after saving.</p>
      <form id="account-reset-form" class="space-y-3">
        <input type="hidden" name="token" id="reset-token" />
        <label class="block text-xs font-medium text-zinc-300">
          New password
          <input name="password" type="password" required minlength="8" autocomplete="new-password"
                 class="mt-1 w-full min-h-[44px] rounded-2xl border border-zinc-800 bg-black px-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#25D366]" />
        </label>
        <p id="account-reset-form-status" class="text-sm text-zinc-400" role="status"></p>
        <button type="submit" class="w-full min-h-[48px] rounded-full bg-[#25D366] text-[#1B1035] font-bold text-sm">Save password</button>
      </form>
      <p class="text-sm text-zinc-400 text-center"><a href="forgot-password.html" class="text-[#25D366] font-semibold">Request a new link</a></p>
    </section>
  </main>
  <div id="sokoni-shell-nav"></div>
  <script src="assets/js/shell-chrome.js"></script>
  <script src="assets/js/account-auth.js"></script>
  <script src="assets/js/account-gate.js"></script>

  <!-- Path B: React + Framer Motion progressive enhancement (fail-soft) -->
  <script src="assets/js/sokoni-motion/sokoni-motion.js" defer></script>
</body>
</html>
