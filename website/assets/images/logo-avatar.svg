<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Sokoni">
  <title>Sokoni</title>
  <desc>Sokoni mark: a market bag carrying an escrow check.</desc>
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123227"/>
      <stop offset="55%" stop-color="#0B1F18"/>
      <stop offset="100%" stop-color="#07140F"/>
    </linearGradient>
    <linearGradient id="bag" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#5BFFA3"/>
      <stop offset="45%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#12984A"/>
    </linearGradient>
    <linearGradient id="grip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="50%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F0C964"/>
    </linearGradient>
  </defs>

  <rect width="640" height="640" rx="146" fill="url(#tile)"/>

  <!-- handle: one confident arc, thick enough to hold at small sizes -->
  <path d="M236 258 C236 168 404 168 404 258"
        fill="none" stroke="url(#grip)" stroke-width="34" stroke-linecap="round"/>

  <!-- bag body: slight taper so it reads as a bag, not a box -->
  <path fill="url(#bag)"
        d="M168 252 H472 C492 252 506 269 503 289 L470 487
           C464 522 432 540 320 540 C208 540 176 522 170 487
           L137 289 C134 269 148 252 168 252 Z"/>

  <!-- escrow check: held inside the bag, the whole point of the brand -->
  <path d="M243 378 L296 431 L405 322"
        fill="none" stroke="#08331F" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.28"/>
  <path d="M243 372 L296 425 L405 316"
        fill="none" stroke="#FFF8F0" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- top light so the bag has a little form without clutter -->
  <path fill="#FFFFFF" opacity="0.16"
        d="M168 252 H472 C492 252 506 269 503 289 L498 318 H142 L137 289 C134 269 148 252 168 252 Z"/>
</svg>
