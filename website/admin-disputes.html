<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dispute Resolution Desk · Sokoni Admin</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          brand: { green: "#00D26A", purple: "#1A1A1A", purpleLight: "#2A2A2A", cream: "#F4F4F4", red: "#FF2300" },
        },
        fontFamily: {
          sans: ['"DM Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
          display: ['"DM Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/admin-depop.css" />
</head>
<body class="admin-depop admin-body antialiased min-h-screen">
  <header class="admin-chrome">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div>
        <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
          <span class="admin-os-pill">Admin OS</span>
          <h1 class="admin-title" style="font-size:1.15rem;">Sokoni <span class="dot">.</span> Disputes</h1>
        </div>
        <nav class="admin-nav" aria-label="Admin desks">
          <a href="admin-command.html">Orders</a>
          <span class="is-active">Disputes</span>
          <a href="admin-sellers-shops.html">Shops</a>
          <a href="admin-seller-listings.html">Listings</a>
          <a href="admin-support.html">Support</a>
          <a href="admin-boda.html">Boda</a>
        </nav>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;">
        <span class="admin-boss">Resolution desk</span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-5 py-8 space-y-5">
    <section class="rounded-3xl border border-black/5 bg-white p-5 space-y-3">
      <h1 class="font-display text-2xl sm:text-3xl font-black uppercase tracking-tight">Dispute resolution desk</h1>
      <p class="text-sm text-brand-purple/65">
        Review buyer tickets with tracking + statements. Escrow stays held until you refund or release.
        M-Pesa refunds are marked for manual Till transfer until reverse API is live.
      </p>
      <label class="block text-sm font-medium">
        Admin token
        <input
          id="admin-token"
          type="password"
          autocomplete="off"
          class="mt-1 w-full min-h-[48px] rounded-2xl border border-black/10 px-4 text-sm"
          placeholder="ADMIN_SETUP_TOKEN"
        />
      </label>
      <div class="flex flex-wrap gap-2">
        <button id="load-open-btn" type="button" class="min-h-[44px] px-4 rounded-full bg-brand-green text-brand-purple text-sm font-bold">
          Load open
        </button>
        <button id="load-all-btn" type="button" class="min-h-[44px] px-4 rounded-full border border-brand-purple/20 text-sm font-semibold">
          Load all
        </button>
      </div>
      <p id="admin-status" class="text-sm text-brand-purple/60"></p>
    </section>

    <section id="disputes-list" class="space-y-4"></section>
  </main>

  <script src="assets/js/admin-disputes.js"></script>

  <!-- Path B: React + Framer Motion progressive enhancement (fail-soft) -->
  <script src="assets/js/sokoni-motion/sokoni-motion.js?v=20260806b" defer></script>
</body>
</html>
