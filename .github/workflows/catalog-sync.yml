name: Catalog Sync

# DEPRECATED — affiliate era only. Kept for reference, not scheduled.
#
# This drives scripts/sync/ (Amazon PA-API, AliExpress, opt-in structured-data
# readers for Kilimall/Jumia/Temu), which has not been touched since the first
# day of the repo. Sokoni pivoted to a peer-to-peer prepaid marketplace on
# 2026-07-27; products.json is now written by sellers through the Seller Hub
# and the VM's own catalog publish.
#
# Leaving it on a nightly cron meant a job with `contents: write` could mutate
# the live catalog on a schedule, for a business model that no longer exists.
# The schedule is removed. Manual dispatch stays so the affiliate path can be
# exercised deliberately if it is ever revived.
#
# See docs/CATALOG_SYNC.md for the original design.

on:
  workflow_dispatch: {} # manual only — no schedule, by design

permissions:
  contents: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run catalog sync
        env:
          # Amazon PA-API 5.0
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_HOST: ${{ vars.AMAZON_HOST }}
          AMAZON_REGION: ${{ vars.AMAZON_REGION }}
          AMAZON_MARKETPLACE: ${{ vars.AMAZON_MARKETPLACE }}
          # AliExpress Affiliate API
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          ALIEXPRESS_TARGET_CURRENCY: ${{ vars.ALIEXPRESS_TARGET_CURRENCY }}
          ALIEXPRESS_TARGET_LANGUAGE: ${{ vars.ALIEXPRESS_TARGET_LANGUAGE }}
          # Opt-in structured-data reader for Kilimall/Jumia/Temu
          SOKONI_ENABLE_SCRAPE: ${{ vars.SOKONI_ENABLE_SCRAPE }}
        run: node scripts/sync/sync.mjs

      - name: Commit updated catalog
        run: |
          git config user.name "sokoni-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add website/data/products.json whatsapp-bot/src/data/products.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "chore(catalog): automated price/availability sync [skip ci]"
            git push
          fi
